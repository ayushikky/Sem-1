<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bowling Animation</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        body{
            background-color: rgb(70, 70, 70);
        }
        .parent{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            margin: 0px;
            padding: 0px;
        }
        .bowling-background{
            align-items: center;
            width: 700px;
            height: 400px;
            background-color: rgb(255, 252, 57);
        
        }
        .ball{
            height: 100px;
            width: 100px;
            background-color: rgb(0, 0, 0);
            border-radius: 50%;
            border: 5px solid rgb(113, 113, 113);
            transform: translate(0px, 300px);
            transition: transform;
            transition-duration: 1s;
            transition-timing-function: ease-in-out;
        }
        .box{
            display: inline-block;
            height: 130px;
            width: 20px;
            background-color: rgb(255, 255, 255);
            border-radius: 5px;
            border: 3px solid black;
            transform: translate(600px, 170px);
            transform-origin: bottom right;
        }
        .pin1{
            transition: transform;
            transition-duration: 0.5s;
            transition-timing-function: ease-in-out;
            transition-delay: 0.7s;
        }
        .pin2{
            transition: transform;
            transition-duration: 0.5s;
            transition-timing-function: ease-in-out;
            transition-delay: 0.8s;
        }
        .pin3{
            transition: transform;
            transition-duration: 0.5s;
            transition-timing-function: ease-in;
            transition-delay: 0.9s;
        }
        .ball:hover{
            transform: translate(600px, 300px) rotate(360deg);
        }
        .ball:hover ~ .box{
            transform: translate(600px, 170px) rotate(90deg);
        }
        .ht{
            margin-top: 50px;
            margin-bottom: 0px;
        }
        .ht:hover{
            color: rgb(255, 0, 0);
        }
        .head{
            text-align: center;
            font-size: 50px;
            color: rgb(255, 255, 255);
        }
        .ins{
            text-align: center;
            font-size: 20px;
            color: rgb(0, 0, 0);
            text-decoration: underline;
        }
        .hole{
            height: 10px;
            width: 10px;
            background-color: rgb(255, 255, 255);
            border-radius: 50%;
            transform: translate(50px, 50px);
            position: absolute;
        }
        #hole1{
            transform: translate(20px, 20px);
        }
        #hole2{
            transform: translate(40px, 20px);
        }
        #hole3{
            transform: translate(30px, 40px);
        }
    </style>
</head>
<body>
    <div class="ht"><h1 class="head">Bowling Animation</h1></div>
    <div class="ins"><h3>keep the cursor over the ball to see the animation</h3></div>
    <div class="parent">
        <div class="bowling-background">
            <div class="ball">
                <div class="hole" id="hole1"></div>
                <div class="hole" id="hole2"></div>
                <div class="hole" id="hole3"></div>
            </div>
            <div class="box pin1"></div>
            <div class="box pin2"></div>
            <div class="box pin3"></div>
        </div>

    </div>
</body>
</html>
